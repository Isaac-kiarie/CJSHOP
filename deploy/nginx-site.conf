upstream cjshop_app {
    server unix:/run/cjshop/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    server_tokens off;
    client_max_body_size 6m;

    access_log /var/log/nginx/cjshop.access.log;
    error_log  /var/log/nginx/cjshop.error.log;

    location /static/ {
        alias /srv/cjshop/app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /media/ {
        alias /srv/cjshop/app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
        access_log off;
    }

    location = /accounts/login/ {
        limit_req zone=cj_auth burst=10 nodelay;
        include /etc/nginx/snippets/cjshop-proxy.conf;
    }

    location = /accounts/register/ {
        limit_req zone=cj_auth burst=10 nodelay;
        include /etc/nginx/snippets/cjshop-proxy.conf;
    }

    location /__ADMIN__/ {
        limit_req zone=cj_auth burst=20 nodelay;
        include /etc/nginx/snippets/cjshop-proxy.conf;
    }

    # Safaricom's callback is never throttled by us.
    location /payments/callback/ {
        include /etc/nginx/snippets/cjshop-proxy.conf;
    }

    location / {
        limit_req zone=cj_general burst=60 nodelay;
        include /etc/nginx/snippets/cjshop-proxy.conf;
    }
}